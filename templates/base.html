<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Portfolio Suggestion Engine{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="mark">◆</span> Portfolio Suggestion Engine
    </a>
    <span class="tag">CMPE 285</span>
  </header>
  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}" role="alert" id="flash-{{ loop.index }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">For education only. This is not financial advice.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
